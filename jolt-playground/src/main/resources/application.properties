server.port=${port:8080}
spring.datasource.url=${datasource.url:jdbc:h2:file:./data/jolt-db}
spring.datasource.driver-class-name=${datasource.driver-class-name:org.h2.Driver}
spring.datasource.username=${datasource.username:sa}
spring.datasource.password=${datasource.password:admin}
spring.jpa.database-platform=${datasource.dialect:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=${h2.console.enabled : false}
